<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studeria — Fiche apprenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F5EF;
    --ink: #1D2420;
    --ink-soft: #5B655D;
    --line: #D9D4C6;
    --teal: #1F5D50;
    --teal-soft: #E4EEE9;
    --amber: #C4832E;
    --amber-soft: #F5E9D6;
    --clay: #B14B3D;
    --clay-soft: #F4E3DF;
    --blue: #35618C;
    --blue-soft: #E1EAF1;
    --card: #FFFFFF;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    padding: 48px 40px 90px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 920px; margin: 0 auto; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size: 13px; color: var(--ink-soft); text-decoration:none;
    margin-bottom: 20px;
  }
  .back-link:hover{ color: var(--ink); }

  header{
    display:flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 22px; margin-bottom: 32px; gap: 24px; flex-wrap: wrap;
  }
  header .title{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px; letter-spacing: -0.01em; line-height: 1.05; }
  header .sub{ color: var(--ink-soft); font-size: 14px; margin-top: 8px; }
  header .idbadge{ font-size: 12.5px; color: var(--ink-soft); text-align:right; }

  section.block{ margin-bottom: 40px; }
  .block-head{ display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .block-head h2{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; margin: 0; }

  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .grid3{ display:grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  @media (max-width: 640px){ .grid2, .grid3{ grid-template-columns: 1fr; } }
  .field{ background: var(--card); padding: 16px 18px; }
  .field .label{ font-size: 11.5px; color: var(--ink-soft); margin-bottom: 5px; }
  .field .value{ font-size: 15px; font-weight: 500; }

  .pill{ font-size: 11.5px; padding: 4px 10px; border-radius: 100px; font-weight: 500; white-space: nowrap; display:inline-block; }
  .pill.green{ background: var(--teal-soft); color: var(--teal); }
  .pill.amber{ background: var(--amber-soft); color: var(--amber); }
  .pill.blue{ background: var(--blue-soft); color: var(--blue); }
  .pill.clay{ background: var(--clay-soft); color: var(--clay); }

  .onboard-steps{ display:flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .step{ display:flex; align-items:center; gap:7px; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 100px; background: var(--card); }
  .step .dot{ width:8px; height:8px; border-radius:50%; }
  .step.done .dot{ background: var(--teal); }
  .step.pending .dot{ background: var(--clay); }
  .step.done{ color: var(--ink); }
  .step.pending{ color: var(--ink-soft); }

  .doc-list{ border: 1px solid var(--line); }
  .doc-row{
    display:flex; align-items:center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  .doc-row:last-child{ border-bottom: none; }
  .doc-row .doc-name{ font-size: 14.5px; font-weight: 500; }
  .doc-row .doc-meta{ display:flex; align-items:center; gap: 12px; }
  .dl-btn{
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 3px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor:pointer;
  }
  .dl-btn:disabled{ opacity: .35; cursor: not-allowed; border-color: var(--line); background: transparent; color: var(--ink-soft); }

  .finance-row{
    display:flex; justify-content: space-between; align-items:center;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .finance-row:last-child{ border-bottom: none; }
  .finance-row .label{ font-size: 13.5px; color: var(--ink-soft); }
  .finance-row .value{ font-size: 15px; font-weight: 500; }

  .bar{ height: 8px; background:#EDEAE0; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar>span{ display:block; height:100%; background: var(--teal); border-radius: 4px; }

  .link-box{
    display:flex; align-items:center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border: 1px dashed var(--line); border-radius: 4px; background: var(--card);
    font-size: 13px; margin-top: 10px;
  }
  .link-box code{ color: var(--ink-soft); word-break: break-all; }
  .copy-btn{
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 3px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap;
  }

  .not-found{ padding: 60px 0; text-align:center; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="index.html">← Retour au dashboard</a>

  <div id="content">Chargement…</div>

</div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id'), 10);
const learner = window.STUDERIA_LEARNERS.find(l => l.id === id);

function fmtDate(d){
  if(!d) return null;
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}
function fmtEUR(n){
  return n.toLocaleString('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits:0});
}
function statutPillClass(s){
  return s==="Terminée" ? "green" : s==="En cours" ? "blue" : s==="Vérifiée" ? "amber" : "clay";
}
function onboardPillClass(s){
  return s==="Complet" ? "green" : s==="En cours" ? "blue" : "clay";
}

function triggerDownload(filename, text){
  const blob = new Blob([text], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

if(!learner){
  document.getElementById('content').innerHTML = `<div class="not-found">
    <p>Apprenant introuvable (id manquant ou invalide).</p>
    <p><a class="back-link" href="index.html" style="display:inline">← Retour au dashboard</a></p>
  </div>`;
} else {
  document.title = `Studeria — ${learner.name}`;

  document.getElementById('content').innerHTML = `
    <header>
      <div>
        <div class="title">${learner.name}</div>
        <div class="sub">${learner.programme} · Coach ${learner.coach}</div>
      </div>
      <div class="idbadge">ID apprenant #${String(learner.id).padStart(4,'0')}<br>Statut formation : <span class="pill ${statutPillClass(learner.statut)}">${learner.statut}</span></div>
    </header>

    <section class="block">
      <div class="block-head"><h2>Identité</h2></div>
      <div class="grid2">
        <div class="field"><div class="label">Nom complet</div><div class="value">${learner.name}</div></div>
        <div class="field"><div class="label">Email</div><div class="value">${learner.email}</div></div>
        <div class="field"><div class="label">Téléphone</div><div class="value">${learner.phone}</div></div>
        <div class="field"><div class="label">Programme</div><div class="value">${learner.programme}</div></div>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Onboarding</h2><span class="pill ${onboardPillClass(learner.onboarding.status)}">${learner.onboarding.status}</span></div>
      <div class="onboard-steps">
        <div class="step ${learner.onboarding.adbFilled ? 'done':'pending'}"><span class="dot"></span>Dossier ADB</div>
        <div class="step ${learner.onboarding.conventionSigned ? 'done':'pending'}"><span class="dot"></span>Convention signée</div>
        <div class="step ${learner.onboarding.kickoffDone ? 'done':'pending'}"><span class="dot"></span>RDV de démarrage</div>
        <div class="step ${learner.onboarding.platformAccess ? 'done':'pending'}"><span class="dot"></span>Accès plateforme</div>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Documents</h2></div>
      <div class="doc-list" id="docList"></div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Financement</h2></div>
      <div class="grid3">
        <div class="field"><div class="label">Type de financement</div><div class="value">${learner.financing.type}</div></div>
        <div class="field"><div class="label">Montant formation</div><div class="value">${fmtEUR(learner.financing.totalAmount)}</div></div>
        <div class="field"><div class="label">Facturation</div><div class="value"><span class="pill ${learner.financing.invoiced ? 'green':'amber'}">${learner.financing.invoiced ? 'Facturée' : 'Non facturée'}</span></div></div>
      </div>
      <div style="margin-top:16px;">
        <div class="finance-row" style="border:none; padding-bottom:0;">
          <div class="label">Paiement</div>
          <div class="value">${learner.financing.pctPaid}%</div>
        </div>
        <div class="bar"><span style="width:${learner.financing.pctPaid}%"></span></div>
      </div>
      <div class="link-box">
        <code>https://pay.studeria.fr/encaissement/${learner.id}</code>
        <button class="copy-btn" id="copyLinkBtn">Copier le lien</button>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Encaissement</h2></div>
      <div class="grid2">
        <div class="field"><div class="label">Montant perçu</div><div class="value">${fmtEUR(learner.financing.amountCollected)}</div></div>
        <div class="field"><div class="label">Montant à percevoir</div><div class="value">${fmtEUR(learner.financing.amountDue)}</div></div>
      </div>
    </section>
  `;

  const docIcons = { Programme: "📘", Convention: "📄", ADB: "🗂️", Livret: "📖", Attestation: "🏅" };
  document.getElementById('docList').innerHTML = learner.documents.map(doc => `
    <div class="doc-row">
      <div class="doc-name">${docIcons[doc.kind] || "📄"} ${doc.name}</div>
      <div class="doc-meta">
        ${doc.statusLabel ? `<span class="pill ${doc.available ? 'green' : 'amber'}">${doc.statusLabel}</span>` : (doc.available ? '' : '<span class="pill clay">Non disponible</span>')}
        <button class="dl-btn" data-doc="${doc.name}" ${doc.available ? '' : 'disabled'}>Télécharger</button>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.dl-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const docName = btn.dataset.doc;
      const content = `Studeria — ${docName}\nApprenant : ${learner.name}\nProgramme : ${learner.programme}\n\n(Document de démonstration — à remplacer par le vrai fichier une fois connecté à Airtable/Drive.)`;
      triggerDownload(`${docName.replace(/\s+/g,'_')}_${learner.lastName}.txt`, content);
    });
  });

  document.getElementById('copyLinkBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(`https://pay.studeria.fr/encaissement/${learner.id}`);
    const btn = document.getElementById('copyLinkBtn');
    const original = btn.textContent;
    btn.textContent = "Copié !";
    setTimeout(()=> btn.textContent = original, 1500);
  });
}
</script>
</body>
</html>
